services:
  - type: web
    name: flash-afterlife
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL_NAME
        value: gemma-4-26b-a4b-it
      - key: SERPAPI_API_KEY
        sync: false
